# About me: manifest of the usdx-audio library crate. It holds the GStreamer playback
# engine (playbin3 player with rate and range control) and the waveform/vocal-activity
# analysis with its cache, independent of Qt.

[package]
name = "usdx-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The GStreamer dependency lives under dev-dependencies while only the test
# media helper (a cfg(test) module) uses it; task P4-02 moves it to
# [dependencies] when the player lands.
[dev-dependencies]
gstreamer = "0.25.4"
tempfile = "3.27.0"
