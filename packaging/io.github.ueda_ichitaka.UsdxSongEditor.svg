<?xml version="1.0" encoding="UTF-8"?>
<!-- About me: the application icon of the USDX Song Editor. A white microphone with
     a small note on a blue rounded square; the installed file name must stay
     io.github.ueda_ichitaka.UsdxSongEditor.svg because the desktop entry and the
     Kirigami window reference the icon by that name. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>USDX Song Editor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1d6fa5"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)"/>
  <!-- microphone capsule -->
  <rect x="25" y="9" width="14" height="24" rx="7" fill="#ffffff"/>
  <line x1="28" y1="15" x2="36" y2="15" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="36" y2="20" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="25" x2="36" y2="25" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round"/>
  <!-- microphone yoke and stem -->
  <path d="M20 27 a12 12 0 0 0 24 0" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="32" y2="48" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="40" y2="50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- eighth note -->
  <ellipse cx="46" cy="41" rx="4" ry="3.2" fill="#ffffff" transform="rotate(-15 46 41)"/>
  <path d="M49.5 40.5 V 24 q 3 1 5 4" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
