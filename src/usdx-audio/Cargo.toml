# About me: manifest of the usdx-audio library crate. It holds the GStreamer playback
# engine (playbin3 player with rate and range control) and the waveform/vocal-activity
# analysis with its cache, independent of Qt.

[package]
name = "usdx-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The GStreamer dependency is used by the player (P4-02) and the test media
# helper (a cfg(test) module); gstreamer-app joins in P4-03 for the analysis
# appsink.
[dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
thiserror = "2.0.21"
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3.27.0"
