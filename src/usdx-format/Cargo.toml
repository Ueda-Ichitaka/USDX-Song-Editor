# About me: manifest of the usdx-format library crate. It holds the lossless UltraStar
# song file model (byte layer, rows, song view, timing, serializer, validation), so the
# editor and the edit operations work on files that save back unchanged.

[package]
name = "usdx-format"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8.44"
chardetng = "1.0.0"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
